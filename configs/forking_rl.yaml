

model: Qwen/Qwen3-4B
model_revision: 1cfa9a7208912126459214e8b04321603b3df60c
seed: 42

data:
  train: data/processed/train_rl.jsonl

rollout:
  n: 8
  temperature: 1.0
  top_p: 1.0
  top_k: -1
  batch_prompts: 8
  log_prob_micro_batch_size_per_gpu: 1
  max_prompt_tokens: 4096

  max_response_tokens: 16384

reward:
  function: src/train/reward_forking_rl.py

optim:
  adv: grpo
  norm_adv_by_std_in_grpo: false
  loss_agg_mode: token-mean

  entropy_top_ratio: 0.2
  lr: 1.0e-6
  ppo_mini_batch_size: 8
  ppo_micro_batch_size_per_gpu: 1
  ppo_max_token_len_per_gpu: 28672
  ppo_epochs: 1
  clip_ratio: 0.2
  clip_ratio_low: 0.2
  eps_high: 0.28
  entropy_coeff: 0.0
  use_kl_loss: true
  kl_coef: 1.0e-3
  kl_loss_type: low_var_kl
  grad_ckpt: true
  dynamic_bsz: true
  optimizer_offload: true
  gpu_memory_utilization: 0.70
  tp: 1

run:
  wandb_project: EffieReasoner
  out_root: outputs/models/baselines
  total_steps: 80
  save_freq: 40
  val_freq: -1
  val_before_train: false
